<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}Online admission{% endblock %}{% if school_settings %} — {{ school_settings.school_name }}{% endif %}</title>
<style>
body{margin:0;background:#f3f6fa;color:#1e293b;font:15px system-ui,-apple-system,sans-serif}.top{background:#173b67;color:#fff;padding:18px 5%;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:12px}.brand img{width:44px;height:44px;object-fit:contain;background:#fff;border-radius:8px}.top a{color:#fff;margin-left:18px}.wrap{max-width:850px;margin:28px auto;padding:0 16px}.card{background:#fff;border:1px solid #dce4ee;border-radius:14px;padding:26px;box-shadow:0 8px 25px rgba(29,52,79,.06)}.intro{color:#64748b}.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}label{font-weight:600}input,select,textarea{width:100%;box-sizing:border-box;padding:11px;border:1px solid #cbd5e1;border-radius:7px;margin:6px 0 14px;background:#fff}.errorlist{color:#b42318;margin:4px 0;padding-left:20px}.btn{display:inline-block;border:0;border-radius:8px;background:#1769aa;color:#fff;padding:11px 17px;text-decoration:none;cursor:pointer}.btn.secondary{background:#e7eef6;color:#173b67}.notice{padding:14px;border-radius:8px;background:#edf7ed;margin:15px 0}.status{font-size:20px;font-weight:700}.muted{color:#64748b}@media(max-width:650px){.grid{grid-template-columns:1fr}.card{padding:18px}.top{padding:14px 16px;display:block}.top nav{margin-top:10px}.top a{margin:0 16px 0 0}}
</style></head><body>
<header class="top"><div class="brand">{% if school_settings.school_logo %}<img src="{{ school_settings.school_logo.url }}" alt="">{% endif %}<strong>{{ school_settings.school_name|default:"School Online Admissions" }}</strong></div><nav><a href="{% url 'public_admission_apply' %}">Apply</a><a href="{% url 'public_admission_track' %}">Track application</a></nav></header>
<main class="wrap">{% block content %}{% endblock %}</main></body></html>
