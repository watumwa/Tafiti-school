<header class="ui-page-header">
  <div class="ui-page-header__copy">
    {% if eyebrow %}<span class="ui-eyebrow">{{ eyebrow }}</span>{% endif %}
    <h1 class="ui-page-title">{{ title }}</h1>
    {% if description %}<p class="ui-page-description">{{ description }}</p>{% endif %}
  </div>
  {% if actions_template %}<div class="ui-page-actions">{% include actions_template %}</div>{% endif %}
</header>
