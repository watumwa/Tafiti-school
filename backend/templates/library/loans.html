{% extends 'base.html' %}{% block content %}{% include 'library/_styles.html' %}<div class="lib-shell"><header class="lib-head"><div><h1>Circulation</h1><p>Find an active loan quickly by borrower, title, barcode or accession number.</p></div><div class="lib-actions"><a class="btn btn-primary" href="{% url 'library_issue' %}">+ Issue book</a><a class="btn btn-default" href="{% url 'library_fines' %}">Fines</a></div></header><form method="get" class="lib-card lib-filter" style="grid-template-columns:2fr 1fr auto"><div><label>Search or scan barcode</label><input name="q" value="{{ query }}" autofocus placeholder="Borrower, student ID, title, barcode or accession"></div><div><label>Attention</label><select name="status"><option value="active" {% if selected_status == 'active' %}selected{% endif %}>All current loans</option><option value="overdue" {% if selected_status == 'overdue' %}selected{% endif %}>Overdue</option><option value="due_today" {% if selected_status == 'due_today' %}selected{% endif %}>Due today</option></select></div><button class="btn btn-primary">Find loan</button></form><section class="lib-card">{% include 'library/_loan_table.html' %}</section></div>{% endblock %}
