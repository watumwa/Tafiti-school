{% load crispy_forms_tags %}
<form method="POST" enctype="multipart/form-data" action="{% url 'edit_student_page' student.id %}{% if is_modal %}?modal=1{% endif %}" id="editStudentFormModal" class="table-edit-modal-form" data-no-loading="true" data-protect-unsaved="true">
    {% csrf_token %}
    {{ form|crispy }}
    <div class="modal-footer table-edit-modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" data-dismiss="modal">Cancel</button>
        <button type="submit" class="btn btn-primary">
            <i class="fa fa-save me-1"></i>Save changes
        </button>
    </div>
</form>
