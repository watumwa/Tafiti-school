name: Apply requested academic and finance fixes

on:
  push:
    branches:
      - fix/results-finance-classes-20261006
    paths:
      - '.github/workflows/apply-requested-fixes.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/results-finance-classes-20261006
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply requested code changes
        run: python .github/scripts/apply_requested_fixes.py

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Create migration and run backend checks
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: core.settings.development
          DJANGO_SECRET_KEY: ci-development-secret
        run: |
          python manage.py makemigrations app --name result_verification_toggle
          python manage.py check
          python manage.py test backend.test_student_finance_workflow backend.test_workspace_finance backend.test_workspace_results_operations

      - name: Compile modified Python modules
        run: python -m py_compile backend/backend/marks_workspace.py backend/backend/student_finance.py backend/backend/workspace_context.py backend/app/services/results_sampling.py backend/app/models/results.py backend/app/models/fees_payment.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Typecheck frontend
        working-directory: frontend
        run: |
          npm ci
          npm run typecheck

      - name: Commit requested fixes and remove temporary patch files
        run: |
          git config user.name "ChatGPT GitHub Automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-requested-fixes.yml .github/scripts/apply_requested_fixes.py
          git add backend frontend
          git status --short
          git commit -m "fix: results verification, teacher marks, finance and class register"
          git push origin HEAD:fix/results-finance-classes-20261006
