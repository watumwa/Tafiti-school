name: Workspace Check

on:
  push:
    branches:
      - nextjs-ui-reference-rest
      - main
  pull_request:
    paths:
      - 'frontend/**'
      - 'backend/**'
      - '.github/workflows/frontend-check.yml'

jobs:
  frontend-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build

  backend-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile workspace backend modules
        run: python -m py_compile backend/backend/academic_workspace.py backend/backend/admissions_workspace.py backend/backend/attendance_workspace.py backend/backend/communication_workspace.py backend/backend/finance_operations.py backend/backend/library_workspace.py backend/backend/marks_workspace.py backend/backend/parent_access_management.py backend/backend/results_operations.py backend/backend/student_finance.py backend/backend/timetable_operations.py backend/backend/urls.py backend/backend/workspace.py backend/backend/workspace_context.py backend/backend/workspace_exports.py backend/backend/auth.py backend/backend/views.py backend/app/services/parent_portal.py backend/app/utils/credentials.py

  backend-runtime:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: pip install -r requirements.txt
      - name: Django system check with development SQLite
        env:
          DJANGO_SETTINGS_MODULE: core.settings.development
          DJANGO_SECRET_KEY: ci-development-secret
        run: python manage.py check
      - name: Verify migrations are committed
        env:
          DJANGO_SETTINGS_MODULE: core.settings.development
          DJANGO_SECRET_KEY: ci-development-secret
        run: python manage.py makemigrations --check --dry-run
      - name: Operational workflow tests
        env:
          DJANGO_SETTINGS_MODULE: core.settings.development
          DJANGO_SECRET_KEY: ci-development-secret
        run: python manage.py test backend.test_parent_credentials_security backend.test_student_finance_workflow backend.test_workspace_finance backend.test_workspace_admissions backend.test_workspace_attendance_hub backend.test_workspace_results_operations backend.test_workspace_timetable backend.test_workflow_completion
