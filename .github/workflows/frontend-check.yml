name: Workspace Check

on:
  push:
    branches:
      - nextjs-ui-reference-rest
  pull_request:
    paths:
      - 'frontend/**'
      - 'backend/backend/**'
      - '.github/workflows/frontend-check.yml'

jobs:
  frontend-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build

  backend-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile workspace backend modules
        run: python -m py_compile backend/backend/academic_workspace.py backend/backend/marks_workspace.py backend/backend/urls.py backend/backend/workspace.py backend/backend/workspace_context.py
