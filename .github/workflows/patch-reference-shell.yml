name: Patch Reference Shell

on:
  push:
    branches:
      - nextjs-ui-reference-rest
    paths:
      - '.github/workflows/patch-reference-shell.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: nextjs-ui-reference-rest
      - name: Apply hydration-safe routing patch
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('frontend/components/reference/ReferenceDashboardShell.tsx')
          text = path.read_text()
          old = "const verificationEntity = entityId && selectedItem?.resource === 'results' && typeof window !== 'undefined' && new URLSearchParams(window.location.search).get('view') === 'verification';"
          new = "const verificationEntity = Boolean(entityId && selectedItem?.resource === 'results');"
          if old not in text:
              raise SystemExit('Expected routing expression not found')
          path.write_text(text.replace(old, new))
          PY
      - name: Commit patch
        run: |
          git config user.name "Tafiti UI Bot"
          git config user.email "127853693+watumwa@users.noreply.github.com"
          git add frontend/components/reference/ReferenceDashboardShell.tsx
          git commit -m "fix: make result verification routing hydration safe"
          git push origin HEAD:nextjs-ui-reference-rest
