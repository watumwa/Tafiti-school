name: Cleanup generated typecheck file

on:
  push:
    branches:
      - fix/results-finance-classes-20261006
    paths:
      - '.github/workflows/cleanup-generated.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/results-finance-classes-20261006
          fetch-depth: 0
      - name: Restore generated cache and commit
        run: |
          git fetch origin main
          git checkout origin/main -- frontend/tsconfig.tsbuildinfo
          git config user.name "ChatGPT GitHub Automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/cleanup-generated.yml
          git add frontend/tsconfig.tsbuildinfo
          git commit -m "chore: exclude generated typecheck cache"
          git push origin HEAD:fix/results-finance-classes-20261006
