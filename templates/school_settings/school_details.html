{% load crispy_forms_tags %}

<div class="row">
    <div class="col-md-12 col-sm-12">
        <div class="x_panel">
        <div class="x_title">
            <h2>School Details</h2>
            <ul class="nav navbar-right panel_toolbox">
            <li><a class="collapse-link"><i class="fa fa-chevron-up"></i></a>
            </li>
            </ul>
            <div class="clearfix"></div>
        </div>
        <div class="x_content">

            <form method="post" action="{% url 'update_settings_page' %}" enctype="multipart/form-data" data-protect-unsaved="true">
                {% csrf_token %}
                <div class="alert alert-warning">
                    <i class="fa fa-exclamation-triangle"></i>
                    <strong>Production setting:</strong> changes to enabled school levels or the default education level can change which workflows users see. Review the values before saving.
                </div>
                {{ school_settings_form | crispy}}
                <button type="submit" class="btn btn-primary"><i class="fa fa-save"></i> Save settings</button>
            </form>

        </div>
        </div>
    </div>
</div>
